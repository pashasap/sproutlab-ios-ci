name: SproutLab simulator acceptance audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ci/**"
      - ".github/workflows/sim-audit.yml"

concurrency:
  group: sim-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    # Standard GitHub-hosted image with Xcode 27 and the iOS 27 runtime (not a larger runner).
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [phone, pad]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode, runtime, pick device (no boot yet)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          ( mkdir -p "$RUNNER_TEMP/xg" && curl -fsSL -o "$RUNNER_TEMP/xg/x.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            && unzip -q -o "$RUNNER_TEMP/xg/x.zip" -d "$RUNNER_TEMP/xg" && touch "$RUNNER_TEMP/xg/ok" ) > "$RUNNER_TEMP/xg.log" 2>&1 &
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | python3 -c "import sys,re; xs=[l.strip() for l in sys.stdin]; print(max(xs,key=lambda x:[int(n) for n in re.findall(r'\\d+',x.split('Xcode_')[1])]))")
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version; uname -m; sw_vers
          INFO=$(python3 ci/pick_device.py "$DEVICE")
          IFS='|' read -r UDID NAME RT <<< "$INFO"
          echo "DEVICES device=$NAME ($UDID) runtime=$RT xcode=$XC"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          mkdir -p ci/artifacts; echo "device=$NAME runtime=$RT xcode=$XC $(xcodebuild -version | tr '\n' ' ')" > ci/artifacts/env.txt

      - name: XcodeGen and build (generic destination, no simulator booted)
        timeout-minutes: 6
        run: |
          set +e
          for i in $(seq 1 60); do [ -f "$RUNNER_TEMP/xg/ok" ] && break; sleep 1; done
          "$RUNNER_TEMP/xg/xcodegen/bin/xcodegen" generate --spec ci/project.yml || { cat "$RUNNER_TEMP/xg.log"; exit 1; }
          A=ci/artifacts; mkdir -p $A
          T0=$(date +%s)
          build () {
            local log=$1; shift
            xcodebuild build-for-testing -project ci/SproutLab.xcodeproj -scheme SproutLab \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath ci/DD \
              CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO ARCHS=$(uname -m) ONLY_ACTIVE_ARCH=NO \
              "$@" > $log 2>&1 &
            local pid=$! last=0 same=0
            while kill -0 $pid 2>/dev/null; do
              sleep 5; cur=$(wc -l < $log)
              if [ "$cur" = "$last" ]; then same=$((same+5)); else same=0; last=$cur; fi
              if [ $same -ge 90 ]; then echo "BUILD STALL: no log output for 90 s"; kill $pid; sleep 2; kill -9 $pid 2>/dev/null; cp $log $log.stalled; return 2; fi
            done
            wait $pid
          }
          build $A/build.log; RC=$?
          if [ $RC -eq 2 ]; then echo "retrying build once after stall"; pkill -f SWBBuildService; sleep 2; build $A/build.log; RC=$?; fi
          if [ $RC -ne 0 ]; then
            echo "BUILD FAILED (rc=$RC):"; grep -E "error:|warning:" $A/build.log | head -60
            cp $A/build.log $A/build-strict-failed.log
            if grep -q "warning:" $A/build.log; then
              pkill -f SWBBuildService
              build $A/build.log SWIFT_TREAT_WARNINGS_AS_ERRORS=NO || { tail -n 80 $A/build.log; exit 1; }
            else
              tail -n 80 $A/build.log; exit 1
            fi
          fi
          echo "TIMING build=$(( $(date +%s) - T0 ))s, done at $(( $(date +%s) - JOB_T0 ))s"
          echo "swift warning lines: $(grep -cE '\.swift:[0-9]+:[0-9]+: warning:' $A/build.log)"
          ls ci/DD/Build/Products

      - name: Boot simulator, UI test with stall watchdog
        timeout-minutes: 14
        run: |
          set +e
          if [ "$DEVICE" = phone ]; then TEST=testA_Phone; else TEST=testB_Pad; fi
          bash ci/run_ui.sh "$TEST" 1050
          true

      - name: Collect (even after a step timeout)
        if: always()
        timeout-minutes: 1
        run: |
          set +e
          A=ci/artifacts; mkdir -p $A/shots $A/crash
          cp /tmp/slshots/* $A/shots/ 2>/dev/null
          cp ~/Library/Logs/DiagnosticReports/SproutLab* $A/crash/ 2>/dev/null
          ls $A/shots | wc -l; ls $A/crash
          echo "total elapsed=$(( $(date +%s) - JOB_T0 ))s"
          true

      - name: Upload
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: sim-audit-${{ matrix.device }}
          retention-days: 5
          if-no-files-found: ignore
          path: |
            ci/artifacts/*.log
            ci/artifacts/*.txt
            ci/artifacts/*.stalled
            ci/artifacts/stall/**
            ci/artifacts/shots/**
            ci/artifacts/crash/**
