name: SproutLab v12 acceptance audit (simulator, night 1114)

on:
  push:
    branches:
      - ci/night-1114-audit

concurrency:
  group: night-1114-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  night-1114-audit:
    runs-on: xcode-27
    # Month cap: 124 min used at start, stop line 135, so this one job is capped at 10 min (billed <= 11).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Xcode, runtime, pick iPhone Pro (no boot yet)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          ( mkdir -p "$RUNNER_TEMP/xg" && curl -fsSL -o "$RUNNER_TEMP/xg/x.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            && unzip -q -o "$RUNNER_TEMP/xg/x.zip" -d "$RUNNER_TEMP/xg" && touch "$RUNNER_TEMP/xg/ok" ) > "$RUNNER_TEMP/xg.log" 2>&1 &
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | python3 -c "import sys,re; xs=[l.strip() for l in sys.stdin]; print(max(xs,key=lambda x:[int(n) for n in re.findall(r'\\d+',x.split('Xcode_')[1])]))")
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version; uname -m
          INFO=$(python3 - <<'PY'
          import json, re, subprocess
          j = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', '-j']))
          rts = [r for r in j['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable')]
          def num(n): m = re.search(r'(\d+)', n); return int(m.group(1)) if m else 0
          rts = [r for r in rts if any(re.fullmatch(r'iPhone \d+ Pro', t['name']) for t in r.get('supportedDeviceTypes', []))]
          rt = max(rts, key=lambda r: [int(x) for x in r['version'].split('.')])
          phones = [t for t in rt.get('supportedDeviceTypes', []) if re.fullmatch(r'iPhone \d+ Pro', t['name'])]
          phone = max(phones, key=lambda t: num(t['name']))
          devs = j['devices'].get(rt['identifier'], [])
          udid = next((d['udid'] for d in devs if d['deviceTypeIdentifier'] == phone['identifier'] and d.get('isAvailable')), None)
          if not udid:
              udid = subprocess.check_output(['xcrun', 'simctl', 'create', phone['name'], phone['identifier'], rt['identifier']]).decode().strip()
          print('|'.join([udid, phone['name'], rt['name'] + ' ' + rt.get('buildversion', '')]))
          PY
          )
          IFS='|' read -r UDID PHONE RT <<< "$INFO"
          echo "DEVICES phone=$PHONE ($UDID) runtime=$RT xcode=$XC"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: XcodeGen and build (generic destination, no simulator booted)
        timeout-minutes: 5
        run: |
          set +e
          for i in $(seq 1 60); do [ -f "$RUNNER_TEMP/xg/ok" ] && break; sleep 1; done
          "$RUNNER_TEMP/xg/xcodegen/bin/xcodegen" generate --spec ci/project.yml || { cat "$RUNNER_TEMP/xg.log"; exit 1; }
          A=ci/artifacts; mkdir -p $A
          T0=$(date +%s)
          build () {  # log extra-args...; kills xcodebuild when the log is silent for 60 s
            local log=$1; shift
            xcodebuild build-for-testing -project ci/SproutLab.xcodeproj -scheme SproutLab \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath ci/DD \
              CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO ARCHS=$(uname -m) ONLY_ACTIVE_ARCH=NO \
              "$@" > $log 2>&1 &
            local pid=$! last=0 same=0
            while kill -0 $pid 2>/dev/null; do
              sleep 5; cur=$(wc -l < $log)
              if [ "$cur" = "$last" ]; then same=$((same+5)); else same=0; last=$cur; fi
              if [ $same -ge 60 ]; then echo "BUILD STALL: no log output for 60 s; last: $(tail -1 $log | cut -c1-200)"; kill $pid; sleep 2; kill -9 $pid 2>/dev/null; cp $log $log.stalled; return 2; fi
            done
            wait $pid
          }
          build $A/build.log; RC=$?
          if [ $RC -eq 2 ]; then echo "retrying build once after stall"; pkill -f SWBBuildService; sleep 2; build $A/build.log; RC=$?; fi
          if [ $RC -ne 0 ]; then
            echo "BUILD FAILED (rc=$RC):"; grep -E "error:|warning:" $A/build.log | head -40
            cp $A/build.log $A/build-strict-failed.log
            grep -q "warning:" $A/build.log && { pkill -f SWBBuildService; build $A/build.log SWIFT_TREAT_WARNINGS_AS_ERRORS=NO || { tail -n 60 $A/build.log; exit 1; }; } || { tail -n 60 $A/build.log; exit 1; }
          fi
          echo "TIMING build=$(( $(date +%s) - T0 ))s, done at $(( $(date +%s) - JOB_T0 ))s"
          echo "swift warning lines: $(grep -cE '\.swift:[0-9]+:[0-9]+: warning:' $A/build.log)"
          ls ci/DD/Build/Products

      - name: Boot iPhone, UI test with stall watchdog
        timeout-minutes: 9
        run: |
          set +e
          A=ci/artifacts; mkdir -p $A/stall /tmp/v12ctl /tmp/v12shots
          XTR=$(ls ci/DD/Build/Products/*.xctestrun | head -1); echo "xctestrun=$XTR"
          xcrun simctl boot "$SIM_UDID"; xcrun simctl bootstatus "$SIM_UDID" -b > /dev/null
          echo "iPhone booted at $(( $(date +%s) - JOB_T0 ))s"
          xcrun simctl ui "$SIM_UDID" appearance light
          t=$(date +%s)
          NSUnbufferedIO=YES xcodebuild test-without-building -xctestrun "$XTR" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:SproutLabUITests/SproutLabUITests/testA_Phone > $A/test-A.log 2>&1 &
          pid=$!; last=""; same=0; done_at=0; i=0
          while kill -0 $pid 2>/dev/null; do
            sleep 1; i=$((i+1))
            if [ $(( $(date +%s) - JOB_T0 )) -gt 515 ]; then echo "JOB CUTOFF at t=$i"; xcrun simctl io "$SIM_UDID" screenshot $A/stall/cutoff.png > /dev/null 2>&1; break; fi
            if [ $done_at -eq 0 ] && grep -qE "Test Case .*(passed|failed)" $A/test-A.log; then done_at=$i; fi
            if [ $done_at -gt 0 ] && [ $((i - done_at)) -ge 6 ]; then echo "test finished; stopping lingering xcodebuild"; break; fi
            for w in dark light xl; do
              if [ ! -f /tmp/v12ctl/$w-ok ] && grep -q "REQUEST $w$" $A/test-A.log; then
                if [ $w = xl ]; then xcrun simctl ui "$SIM_UDID" content_size accessibility-extra-large
                else xcrun simctl ui "$SIM_UDID" appearance $w; fi
                touch /tmp/v12ctl/$w-ok; echo "host -> $w at t=$i"
              fi
            done
            cur=$(grep -c "AUDIT\|t = " $A/test-A.log)
            if [ "$cur" = "$last" ]; then same=$((same+1)); else same=0; last=$cur; fi
            if [ $same -eq 25 ]; then
              APP=$(pgrep -f "SproutLab.app/SproutLab" | head -1)
              echo "STALL? t=$i app=${APP:-none} last=$(grep AUDIT $A/test-A.log | tail -1 | cut -c1-200)" | tee -a $A/stall/watch.txt
              xcrun simctl io "$SIM_UDID" screenshot $A/stall/t$i.png > /dev/null 2>&1
              [ -n "$APP" ] && sample "$APP" 2 -file $A/stall/t$i-sample.txt > /dev/null 2>&1
            fi
          done
          kill $pid 2>/dev/null; sleep 1; kill -9 $pid 2>/dev/null
          echo "TIMING test=$(( $(date +%s) - t ))s at $(( $(date +%s) - JOB_T0 ))s result=$(grep -E 'Test Case .*(passed|failed)' $A/test-A.log | tail -1)"
          grep -c "AUDIT shot" $A/test-A.log
          true

      - name: Collect (even after a step timeout)
        if: always()
        timeout-minutes: 1
        run: |
          set +e
          A=ci/artifacts; mkdir -p $A/shots $A/crash
          cp /tmp/v12shots/* $A/shots/ 2>/dev/null
          cp ~/Library/Logs/DiagnosticReports/SproutLab* $A/crash/ 2>/dev/null
          ls $A/shots | wc -l; ls $A/crash
          echo "total elapsed=$(( $(date +%s) - JOB_T0 ))s"
          true

      - name: Upload
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: night-1114-audit-artifacts
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ci/artifacts/*.log
            ci/artifacts/*.stalled
            ci/artifacts/stall/**
            ci/artifacts/shots/**
            ci/artifacts/crash/**
